<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Single-Product Feed - Maisonvelle</title>
<!-- Google Fonts: IBM Plex Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-mono: 'IBM Plex Mono', monospace;
    --font-size-base: 16px;
    --line-height-base: 24px;
    --color-text: #000000;
    --color-bg: #ffffff;
    --header-height: 56px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  body {
    font-family: var(--font-mono);
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    color: var(--color-text);
    background-color: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .mobile-canvas {
    width: 390px;
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    background-color: var(--color-bg);
  }

  /* Header 56px high, back arrow left, bag right, NO categories */
  .feed-header {
    height: var(--header-height);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    max-width: 390px;
    margin: 0 auto;
    background-color: var(--color-bg);
    z-index: 50;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--color-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* Scroll Snap Feed Container */
  .feed-container {
    margin-top: var(--header-height);
    width: 100%;
    height: calc(100dvh - var(--header-height));
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }

  @media (prefers-reduced-motion: reduce) {
    .feed-container {
      scroll-behavior: auto;
    }
  }

  /* Single Product Slide */
  .feed-slide {
    width: 390px;
    height: calc(100dvh - var(--header-height));
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    text-decoration: none;
    color: var(--color-text);
  }

  .slide-image-wrapper {
    width: 390px;
    height: 390px;
    margin: auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide-image-wrapper img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .slide-info {
    width: 100%;
    text-align: center;
    padding-bottom: 48px;
  }

  .slide-sku, .slide-price {
    font-family: var(--font-mono);
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    color: var(--color-text);
  }
</style>
</head>
<body>

<div class="mobile-canvas">
  <!-- Feed Header: Back arrow & Bag icon, no categories -->
  <header class="feed-header">
    <button type="button" class="icon-btn" aria-label="Back to grid">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square">
        <polyline points="13 16 7 10 13 4"></polyline>
      </svg>
    </button>
    <button type="button" class="icon-btn" aria-label="View Shopping Bag">
      <svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M2.5 6.5H15.5V18.5H2.5V6.5Z"></path>
        <path d="M6 6.5V4.5C6 2.84315 7.34315 1.5 9 1.5C10.6569 1.5 12 2.84315 12 4.5V6.5"></path>
      </svg>
    </button>
  </header>

  <!-- Feed Container -->
  <main class="feed-container">
    <!-- Slide 1 -->
    <a href="#" class="feed-slide">
      <div class="slide-image-wrapper">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYne9kL7n8annCtdbe_U3iYcnMARm0eoszurvEdqmjeIAA7TPqZr0U0jDHhaIKN9rEkSlKcMTupUYKClsGAhN3nbLnrBFQFpNLcUw3ANQTBcFrVoUROClrHWt4uAeL--TX75idjIE7N9mP688PpTRjoUOTZmgnNYQ2gYH8xqr4dcmDyM8dJMfB2cAKlxn1viTEzA36NKJEkEa8xXGqelbsFxRAf2xo70RDLPXQBtw" alt="TS-03" loading="eager">
      </div>
      <div class="slide-info">
        <p class="slide-sku">TS-03</p>
        <p class="slide-price">R899</p>
      </div>
    </a>

    <!-- Slide 2 -->
    <a href="#" class="feed-slide">
      <div class="slide-image-wrapper">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxbOyB9ZiHjZiU1XhWzcVtYHShs_kd0hk4MkqoyIQjGDfKBiQmTQA2muofAFtsgLrvF_zEDU677VcVOcREaJnd5_ahbwnVM8BcekZPfiBsb_OqX5EYnh92MiottqBXfj08ZNRyPb9-Nlyi77-eokgBSKYDycngfX9JyAQpVyLrEdwoDvLmjvd98lcPk4bf-L7hInWMl8EgtlcVd_Ecq41nClUPiUiXIKc_IAkLi00" alt="WB-01" loading="lazy">
      </div>
      <div class="slide-info">
        <p class="slide-sku">WB-01</p>
        <p class="slide-price">R2 899</p>
      </div>
    </a>

    <!-- Slide 3 -->
    <a href="#" class="feed-slide">
      <div class="slide-image-wrapper">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEtvgt8Qy1-HewEBX99sSOIiXwXRTB_-OyDGItf7IbVNAUEf2K1fkAR6WUCq6KYHB6GO2YeqDLChY5yZSOukQb6c3kD9e_1niue9cQDjw-vMEXEM_6fZIA6PfZYoMwU6KrxyNRHPX4AMlHRNMzIj3XeejD5lGiawhiT0sBFnhdZPETDxNfPtip5XBd75l8yms3Eo1ZnaC5LXJR2eMDALGddTGjuGbEOF_q8s9K3OE" alt="HD-03" loading="lazy">
      </div>
      <div class="slide-info">
        <p class="slide-sku">HD-03</p>
        <p class="slide-price">R2 499</p>
      </div>
    </a>
  </main>
</div>

</body>
</html>
