<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisonvelle - Minimalist Apparel</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/header.css">
<link rel="stylesheet" href="assets/css/shop.css">
<link rel="stylesheet" href="assets/css/footer.css">
<link rel="stylesheet" href="assets/css/cart-drawer.css">
</head>
<body class="page-shop">

<!-- Site Header Partial -->
<div data-include="partials/header.html"></div>

<!-- Main Catalog Content -->
<main class="main-content">
  <div class="shop-grid" id="shop-grid">
    <a href="product.html" class="product-tile">
      <div class="image-wrapper">
        <img src="assets/images/ts-03.jpg" alt="TS-03">
      </div>
      <div class="product-info">
        <p class="product-sku">TS-03</p>
        <p class="product-price">R899</p>
      </div>
    </a>

    <a href="product.html" class="product-tile">
      <div class="image-wrapper">
        <img src="assets/images/ls-03.jpg" alt="LS-03">
      </div>
      <div class="product-info">
        <p class="product-sku">LS-03</p>
        <p class="product-price">R1 199</p>
      </div>
    </a>

    <a href="product.html" class="product-tile">
      <div class="image-wrapper">
        <img src="assets/images/hd-03.jpg" alt="HD-03">
      </div>
      <div class="product-info">
        <p class="product-sku">HD-03</p>
        <p class="product-price">R2 499</p>
      </div>
    </a>

    <a href="product.html" class="product-tile">
      <div class="image-wrapper">
        <img src="assets/images/wb-01.jpg" alt="WB-01">
      </div>
      <div class="product-info">
        <p class="product-sku">WB-01</p>
        <p class="product-price">R2 899</p>
      </div>
    </a>

    <a href="product.html" class="product-tile">
      <div class="image-wrapper">
        <img src="assets/images/sh-01.jpg" alt="SH-01">
      </div>
      <div class="product-info">
        <p class="product-sku">SH-01</p>
        <p class="product-price">R999</p>
      </div>
    </a>

    <a href="product.html" class="product-tile">
      <div class="image-wrapper">
        <img src="assets/images/sp-06.jpg" alt="SP-06">
      </div>
      <div class="product-info">
        <p class="product-sku">SP-06</p>
        <p class="product-price">R1 699</p>
      </div>
    </a>
  </div>

  <!-- Mobile Feed Container -->
  <div class="feed-view" id="mobile-feed-view">
    <a href="product.html" class="feed-slide">
      <div class="feed-image-wrapper">
        <img src="assets/images/ts-03.jpg" alt="TS-03" loading="eager">
      </div>
      <div class="feed-info">
        <p class="product-sku">TS-03</p>
        <p class="product-price">R899</p>
      </div>
    </a>

    <a href="product.html" class="feed-slide">
      <div class="feed-image-wrapper">
        <img src="assets/images/wb-01.jpg" alt="WB-01" loading="lazy">
      </div>
      <div class="feed-info">
        <p class="product-sku">WB-01</p>
        <p class="product-price">R2 899</p>
      </div>
    </a>
  </div>
</main>

<!-- Footer Partial -->
<div data-include="partials/footer.html"></div>

<!-- Mini Cart Partial -->
<div data-include="partials/mini-cart.html"></div>

<script src="assets/js/include.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/shop.js"></script>
<script src="assets/js/cart-drawer.js"></script>
</body>
</html>
