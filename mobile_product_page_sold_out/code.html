<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEPARATE TRACK HOODY - Sold Out State</title>
<!-- Google Fonts: IBM Plex Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-mono: 'IBM Plex Mono', monospace;
    --font-panel: Arial, 'Helvetica Neue', sans-serif;
    --font-size-base: 16px;
    --line-height-base: 24px;
    --color-bg: #8E2B1C;
    --color-text: #FFFFFF;
    --btn-border: 2px solid #FFFFFF;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-mono);
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .mobile-canvas {
    width: 390px;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    padding-bottom: 16px;
  }

  /* Floating Header */
  .floating-header {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    height: 56px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--color-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }

  /* Photo Section */
  .photo-section {
    width: 390px;
    height: 500px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .photo-section img {
    max-width: 320px;
    max-height: 380px;
    object-fit: contain;
  }

  .right-chevron {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--color-text);
    cursor: pointer;
  }

  /* Details Card */
  .details-card {
    margin: 0 12px 12px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-panel);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .color-label {
    font-size: var(--font-size-base);
  }

  .swatches-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .swatch-btn {
    width: 64px;
    height: 64px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: transparent;
    cursor: pointer;
    border-radius: 0;
    padding: 2px;
  }

  .swatch-btn.active {
    border: 2px solid var(--color-text);
  }

  .swatch-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .description-text {
    display: flex;
    flex-direction: column;
    font-size: var(--font-size-base);
    line-height: 1.4;
  }

  .sizing-link {
    font-size: 14px;
    text-decoration: underline;
    color: var(--color-text);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    text-align: left;
  }

  .size-dropdown {
    width: 100%;
    height: 48px;
    background: transparent;
    border: var(--btn-border);
    color: var(--color-text);
    font-family: var(--font-mono);
    font-size: var(--font-size-base);
    padding: 0 16px;
    border-radius: 0;
    appearance: none;
  }

  .size-dropdown option {
    background-color: #ffffff;
    color: #000000;
  }

  /* Sold Out button state: solid white button, bold black text, disabled */
  .sold-out-btn {
    width: 100%;
    height: 48px;
    background-color: #FFFFFF !important;
    color: #000000 !important;
    border: none !important;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: var(--font-size-base);
    text-transform: none;
    border-radius: 0;
    cursor: not-allowed;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-arrows-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .nav-arrow-btn {
    flex: 1;
    height: 44px;
    background: transparent;
    border: var(--btn-border);
    color: var(--color-text);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
    cursor: pointer;
  }
</style>
</head>
<body>

<main class="mobile-canvas">
  <!-- Header -->
  <header class="floating-header">
    <button type="button" class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button type="button" class="icon-btn" aria-label="Shopping Bag">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
    </button>
  </header>

  <!-- Photo Area -->
  <section class="photo-section">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEtvgt8Qy1-HewEBX99sSOIiXwXRTB_-OyDGItf7IbVNAUEf2K1fkAR6WUCq6KYHB6GO2YeqDLChY5yZSOukQb6c3kD9e_1niue9cQDjw-vMEXEM_6fZIA6PfZYoMwU6KrxyNRHPX4AMlHRNMzIj3XeejD5lGiawhiT0sBFnhdZPETDxNfPtip5XBd75l8yms3Eo1ZnaC5LXJR2eMDALGddTGjuGbEOF_q8s9K3OE" alt="SEPARATE TRACK HOODY">
    <button type="button" class="right-chevron" aria-label="Next Photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </section>

  <!-- Details Card -->
  <article class="details-card">
    <div class="title-row">
      <h1>SEPARATE TRACK HOODY</h1>
      <span>R1 299</span>
    </div>

    <div class="color-label">Beige</div>

    <div class="swatches-row">
      <button type="button" class="swatch-btn active" aria-label="Beige Swatch">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEtvgt8Qy1-HewEBX99sSOIiXwXRTB_-OyDGItf7IbVNAUEf2K1fkAR6WUCq6KYHB6GO2YeqDLChY5yZSOukQb6c3kD9e_1niue9cQDjw-vMEXEM_6fZIA6PfZYoMwU6KrxyNRHPX4AMlHRNMzIj3XeejD5lGiawhiT0sBFnhdZPETDxNfPtip5XBd75l8yms3Eo1ZnaC5LXJR2eMDALGddTGjuGbEOF_q8s9K3OE" alt="Beige">
      </button>
    </div>

    <div class="description-text">
      <p>100% cotton.</p>
      <p>Panelled pullover top.</p>
      <p>Wide silhouette.</p>
      <p>Made in Japan.</p>
    </div>

    <div>
      <button type="button" class="sizing-link">sizing</button>
    </div>

    <select class="size-dropdown" aria-label="Select size">
      <option value="S">Small</option>
      <option value="M">Medium</option>
      <option value="L">Large</option>
      <option value="XL">X-Large</option>
    </select>

    <!-- Sold out state: solid white button, bold black text -->
    <button type="button" class="sold-out-btn" disabled>Sold out</button>

    <div class="nav-arrows-row">
      <button type="button" class="nav-arrow-btn" aria-label="Previous product">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <button type="button" class="nav-arrow-btn" aria-label="Next product">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </article>
</main>

</body>
</html>
