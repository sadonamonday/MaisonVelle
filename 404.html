<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found - Maisonvelle</title>
<!-- IBM Plex Mono Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-mono: 'IBM Plex Mono', monospace;
    --font-size-base: 16px;
    --line-height-base: 24px;
    --color-text: #000000;
    --color-bg: #ffffff;
    --color-muted: #c4c4c4;
    --color-footer: #777777;
    --header-height: 64px;
    --page-padding: 24px;
    --btn-border: 2px solid #000000;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  body {
    font-family: var(--font-mono);
    font-weight: 400;
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    color: var(--color-text);
    background-color: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  a:focus-visible, button:focus-visible {
    outline: 1px solid var(--color-text);
    outline-offset: 2px;
  }

  /* Header */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--header-height);
    background-color: var(--color-bg);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--page-padding);
  }

  .header-left, .header-right {
    display: flex;
    align-items: center;
    width: 32px;
  }

  .header-right {
    justify-content: flex-end;
  }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--color-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .category-nav {
    display: flex;
    align-items: center;
    gap: 24px;
    text-transform: uppercase;
  }

  .category-nav a {
    color: var(--color-muted);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: var(--font-size-base);
  }

  .category-nav a.active, .category-nav a:hover {
    color: var(--color-text);
  }

  /* Main 404 Layout */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(var(--header-height) + 48px) var(--page-padding) 48px;
    gap: 24px;
  }

  .error-code {
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
  }

  .error-message {
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    text-transform: uppercase;
    color: var(--color-footer);
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    padding: 0 32px;
    border: var(--btn-border);
    background: transparent;
    color: var(--color-text);
    text-decoration: none;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: var(--font-size-base);
    text-transform: uppercase;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .back-btn:hover {
    background-color: var(--color-text);
    color: var(--color-bg);
  }

  /* Footer */
  .site-footer {
    width: 100%;
    padding-bottom: 64px;
    display: flex;
    justify-content: center;
  }

  .footer-nav {
    display: flex;
    align-items: center;
    gap: 32px;
    text-transform: uppercase;
  }

  .footer-nav a {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 16px;
    color: var(--color-footer);
    text-decoration: none;
  }

  .footer-nav a:hover {
    color: var(--color-text);
  }

  /* Mini Cart Drawer */
  .cart-drawer-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
  }

  .cart-drawer-overlay.open {
    display: block;
  }

  .cart-drawer {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    max-width: 400px;
    height: 100%;
    background-color: #ffffff;
    color: #000000;
    font-family: var(--font-mono);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    border-left: 2px solid #000000;
  }

  .cart-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #000000;
    padding-bottom: 16px;
  }

  .cart-title {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .cart-close-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #000000;
  }

  .cart-items-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #e5e5e5;
    padding-bottom: 12px;
  }

  .cart-item-img {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9f9f9;
  }

  .cart-item-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .cart-item-info {
    flex: 1;
    font-size: 14px;
    line-height: 20px;
  }

  .cart-item-title {
    font-weight: 700;
    text-transform: uppercase;
  }

  .cart-item-meta {
    color: #777777;
    font-size: 12px;
  }

  .cart-drawer-footer {
    border-top: 1px solid #000000;
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .cart-subtotal-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 16px;
  }

  .cart-action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    text-decoration: none;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    border: 2px solid #000000;
  }

  .cart-action-btn.primary {
    background-color: #000000;
    color: #ffffff;
  }

  .cart-action-btn.secondary {
    background-color: transparent;
    color: #000000;
  }
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="header-left">
    <a href="index.html" class="icon-btn" aria-label="Home">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25">
        <polyline points="13 16 7 10 13 4"></polyline>
      </svg>
    </a>
  </div>

  <nav class="category-nav" aria-label="Categories">
    <a href="index.html" class="active">ALL</a>
    <a href="index.html">BAGS</a>
    <a href="index.html">SHIRTS</a>
    <a href="index.html">T-SHIRTS</a>
    <a href="index.html">PANTS</a>
    <a href="index.html">SHOES</a>
    <a href="index.html">ACCESSORIES</a>
  </nav>

  <div class="header-right">
    <button type="button" class="icon-btn" id="bag-btn" aria-label="Shopping Bag">
      <svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.25">
        <path d="M1 5H17V19H1V5Z"></path>
        <path d="M5.5 7V4C5.5 2.34315 6.84315 1 8.5 1H9.5C11.1569 1 12.5 2.34315 12.5 4V7"></path>
      </svg>
    </button>
  </div>
</header>

<!-- Main Error Area -->
<main class="main-content">
  <div class="error-code">404</div>
  <p class="error-message">PAGE NOT FOUND</p>
  <a href="index.html" class="back-btn">RETURN TO SHOP</a>
</main>

<!-- Footer -->
<footer class="site-footer">
  <nav class="footer-nav" aria-label="Footer Navigation">
    <a href="#">CONTACT</a>
    <a href="#">TERMS</a>
    <a href="#">PRIVACY</a>
    <a href="#">ACCESSIBILITY</a>
    <a href="#">COOKIES</a>
    <a href="#">ORDER STATUS</a>
  </nav>
</footer>

<!-- Mini Cart Overlay -->
<div class="cart-drawer-overlay" id="cart-drawer-overlay">
  <aside class="cart-drawer" id="cart-drawer" aria-label="Mini Cart">
    <div class="cart-drawer-header">
      <h2 class="cart-title">BAG (2)</h2>
      <button type="button" class="cart-close-btn" id="cart-close-btn" aria-label="Close cart">✕</button>
    </div>

    <div class="cart-items-list">
      <div class="cart-item">
        <div class="cart-item-img">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEtvgt8Qy1-HewEBX99sSOIiXwXRTB_-OyDGItf7IbVNAUEf2K1fkAR6WUCq6KYHB6GO2YeqDLChY5yZSOukQb6c3kD9e_1niue9cQDjw-vMEXEM_6fZIA6PfZYoMwU6KrxyNRHPX4AMlHRNMzIj3XeejD5lGiawhiT0sBFnhdZPETDxNfPtip5XBd75l8yms3Eo1ZnaC5LXJR2eMDALGddTGjuGbEOF_q8s9K3OE" alt="SEPARATE TRACK HOODY">
        </div>
        <div class="cart-item-info">
          <p class="cart-item-title">SEPARATE TRACK HOODY</p>
          <p class="cart-item-meta">SIZE: M / BEIGE</p>
          <p class="cart-item-price">1 × R1 299</p>
        </div>
      </div>

      <div class="cart-item">
        <div class="cart-item-img">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYne9kL7n8annCtdbe_U3iYcnMARm0eoszurvEdqmjeIAA7TPqZr0U0jDHhaIKN9rEkSlKcMTupUYKClsGAhN3nbLnrBFQFpNLcUw3ANQTBcFrVoUROClrHWt4uAeL--TX75idjIE7N9mP688PpTRjoUOTZmgnNYQ2gYH8xqr4dcmDyM8dJMfB2cAKlxn1viTEzA36NKJEkEa8xXGqelbsFxRAf2xo70RDLPXQBtw" alt="TS-03">
        </div>
        <div class="cart-item-info">
          <p class="cart-item-title">TS-03</p>
          <p class="cart-item-meta">SIZE: L / BLACK</p>
          <p class="cart-item-price">1 × R899</p>
        </div>
      </div>
    </div>

    <div class="cart-drawer-footer">
      <div class="cart-subtotal-row">
        <span>SUBTOTAL</span>
        <span>R2 198</span>
      </div>
      <a href="#" class="cart-action-btn primary">CHECKOUT</a>
      <a href="#" class="cart-action-btn secondary">VIEW BAG</a>
    </div>
  </aside>
</div>

<script>
  (function() {
    const bagBtn = document.getElementById('bag-btn');
    const cartOverlay = document.getElementById('cart-drawer-overlay');
    const cartCloseBtn = document.getElementById('cart-close-btn');

    if (bagBtn && cartOverlay) {
      bagBtn.addEventListener('click', () => cartOverlay.classList.add('open'));
      cartCloseBtn.addEventListener('click', () => cartOverlay.classList.remove('open'));
      cartOverlay.addEventListener('click', (e) => {
        if (e.target === cartOverlay) cartOverlay.classList.remove('open');
      });
    }
  })();
</script>
</body>
</html>
