<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisonvelle - Mobile Shop Grid</title>
<!-- Google Fonts: IBM Plex Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-mono: 'IBM Plex Mono', monospace;
    --font-size-base: 16px;
    --line-height-base: 24px;
    --color-text: #000000;
    --color-bg: #ffffff;
    --color-muted: #c4c4c4;
    --color-footer: #777777;
    --header-height: 56px;
    --grid-gap-x: 12px;
    --grid-gap-y: 40px;
    --page-padding: 16px;
    --font-panel: Arial, 'Helvetica Neue', sans-serif;
    --btn-border: 2px solid #000000;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  body {
    font-family: var(--font-mono);
    font-weight: 400;
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    color: var(--color-text);
    background-color: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
  }

  .mobile-container {
    width: 390px;
    min-height: 100vh;
    background-color: var(--color-bg);
    position: relative;
    display: flex;
    flex-direction: column;
    padding-bottom: 48px;
  }

  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background-color: var(--color-bg);
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 var(--page-padding);
  }

  .icon-btn {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--color-text);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }

  nav.category-slider {
    flex: 1;
    margin: 0 12px;
    overflow-x: auto;
    display: flex;
    align-items: center;
    gap: 20px;
    white-space: nowrap;
  }

  nav.category-slider a {
    color: var(--color-muted);
    text-decoration: none;
    text-transform: uppercase;
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
  }

  nav.category-slider a.active {
    color: var(--color-text);
  }

  main {
    margin-top: 24px;
    padding: 0 var(--page-padding);
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: var(--grid-gap-x);
    row-gap: var(--grid-gap-y);
  }

  .product-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--color-text);
    user-select: none;
  }

  .image-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: transparent;
  }

  .image-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .card-details {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
  }

  footer {
    margin-top: 48px;
    padding: 0 var(--page-padding);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: var(--color-footer);
    text-transform: uppercase;
    font-size: 11px;
    line-height: 18px;
  }

  footer .row {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  footer a {
    color: var(--color-footer);
    text-decoration: none;
  }

  footer a:hover {
    color: var(--color-text);
  }
</style>
</head>
<body>

<div class="mobile-container">
  <!-- Header -->
  <header>
    <button type="button" class="icon-btn" aria-label="Toggle Grid">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2">
        <line x1="10" y1="2" x2="10" y2="18"></line>
        <line x1="2" y1="10" x2="18" y2="10"></line>
      </svg>
    </button>

    <nav class="category-slider no-scrollbar" aria-label="Categories">
      <a href="#" class="active">ALL</a>
      <a href="#">BAGS</a>
      <a href="#">SHIRTS</a>
      <a href="#">T-SHIRTS</a>
      <a href="#">PANTS</a>
      <a href="#">SHOES</a>
      <a href="#">ACCESSORIES</a>
    </nav>

    <button type="button" class="icon-btn" aria-label="Cart">
      <svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M2.5 6.5H15.5V18.5H2.5V6.5Z"></path>
        <path d="M6 6.5V4.5C6 2.84315 7.34315 1.5 9 1.5C10.6569 1.5 12 2.84315 12 4.5V6.5"></path>
      </svg>
    </button>
  </header>

  <!-- Product Grid -->
  <main>
    <div class="grid-container">
      <article class="product-card">
        <div class="image-box">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxbOyB9ZiHjZiU1XhWzcVtYHShs_kd0hk4MkqoyIQjGDfKBiQmTQA2muofAFtsgLrvF_zEDU677VcVOcREaJnd5_ahbwnVM8BcekZPfiBsb_OqX5EYnh92MiottqBXfj08ZNRyPb9-Nlyi77-eokgBSKYDycngfX9JyAQpVyLrEdwoDvLmjvd98lcPk4bf-L7hInWMl8EgtlcVd_Ecq41nClUPiUiXIKc_IAkLi00" alt="WB-01">
        </div>
        <div class="card-details">
          <span>WB-01</span>
          <span>R2 499</span>
        </div>
      </article>

      <article class="product-card">
        <div class="image-box">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBZso6pjWlEQC3sBuojS4Qdp6CdsI3vl7xS2RVvXi2vlrJH2S-yRwCyvEvJdcVNdwdDk9wJj-kqC7cN-iMmztyTyGjV4OcgO2xYCnIrgotixSV4z1VdGrLjOax0brDmXBE6MuTUloaRCjUHPBoiNVhNHtwSJkzcSEds0YgGKCsydUobge60Dl5bykFI92vF5m1aSdG1I3vfNxlTibqDP11cmVpfYOgaVJBXWnH2ro" alt="SH-01">
        </div>
        <div class="card-details">
          <span>SH-01</span>
          <span>R899</span>
        </div>
      </article>

      <article class="product-card">
        <div class="image-box">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKnNH24xOdm208WQgmntUJvIL2DO3fNEx_pAqXVGrVpFfir4dACtf1DsbHOwMysDqOZYC53ZTDvG_v_rmiCKpdV8h4zTP8zfE4K2CpYf74GlkZ69pu1W7mKROSI2yxiXc1sbbP_l0ZnF_JxIkXsvxxaQWFvi1b5dt72PYov60UgT3PBrPOtbA52KkToAw1YMBdatKFgXi_bYvvyW1HywLyd0Jg39Il3DvSqGAgkGQ" alt="SP-06">
        </div>
        <div class="card-details">
          <span>SP-06</span>
          <span>R1 299</span>
        </div>
      </article>
    </div>
  </main>

  <!-- Footer (2 rows, no DNSMPI) -->
  <footer>
    <div class="row" style="margin-bottom: 6px;">
      <a href="#">CONTACT</a>
      <a href="#">TERMS</a>
      <a href="#">PRIVACY</a>
      <a href="#">ACCESSIBILITY</a>
    </div>
    <div class="row">
      <a href="#">COOKIES</a>
      <a href="#">ORDER STATUS</a>
    </div>
  </footer>
</div>

</body>
</html>
