<div class="modal-overlay" id="size-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-label="Size Guide">
    <button type="button" class="modal-close" id="size-modal-close" aria-label="Close size guide">✕</button>
    <h2 class="modal-title">SIZE GUIDE</h2>
    <p class="modal-subtitle">All measurements are in centimeters (cm).</p>

    <table class="size-table">
      <thead>
        <tr>
          <th>SIZE</th>
          <th>CHEST</th>
          <th>SHOULDER</th>
          <th>LENGTH</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>S</td><td>58</td><td>54</td><td>68</td></tr>
        <tr><td>M</td><td>61</td><td>56</td><td>70</td></tr>
        <tr><td>L</td><td>64</td><td>58</td><td>72</td></tr>
        <tr><td>XL</td><td>67</td><td>60</td><td>74</td></tr>
      </tbody>
    </table>
  </div>
</div>
