<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEPARATE TRACK HOODY - Maisonvelle</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/header.css">
<link rel="stylesheet" href="assets/css/product.css">
<link rel="stylesheet" href="assets/css/footer.css">
<link rel="stylesheet" href="assets/css/modal.css">
<link rel="stylesheet" href="assets/css/cart-drawer.css">
</head>
<body class="page-product">

<!-- Header Partial -->
<div data-include="partials/header.html"></div>

<!-- Main Product View -->
<main class="product-main-content">
  <div class="product-container">
    <!-- Gallery Column -->
    <section class="gallery-column">
      <div class="main-photo-wrapper">
        <img id="main-product-img" src="assets/images/hd-03.jpg" alt="SEPARATE TRACK HOODY">
        <button type="button" class="next-chevron" id="next-photo-btn" aria-label="Next image">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <div class="thumbnail-strip" id="thumbnail-strip"></div>
    </section>

    <!-- Details Column -->
    <section class="details-column">
      <div class="details-wrapper">
        <!-- Title & Price Row -->
        <div class="title-price-row">
          <h1 class="product-title" id="p-title">SEPARATE TRACK HOODY</h1>
          <span class="product-price" id="p-price">R1 299</span>
        </div>

        <!-- Colour Name -->
        <div class="colour-label" id="p-color-name">Beige</div>

        <!-- Colour Swatches -->
        <div class="swatches-row" id="p-swatches"></div>

        <!-- Description -->
        <div class="description-box" id="p-desc">
          <p>100% cotton.</p>
          <p>Panelled pullover top.</p>
          <p>Wide silhouette.</p>
          <p>Made in Japan.</p>
        </div>

        <!-- Sizing Link -->
        <div>
          <button type="button" class="sizing-link" id="sizing-modal-trigger">sizing</button>
        </div>

        <!-- Size Selector & Add to Cart -->
        <div class="purchase-row">
          <div class="size-select-wrapper">
            <select class="size-select" aria-label="Select Size">
              <option value="S">Small</option>
              <option value="M">Medium</option>
              <option value="L">Large</option>
              <option value="XL">X-Large</option>
            </select>
          </div>
          <button type="button" class="add-to-cart-btn" id="add-to-cart-btn">Add to cart</button>
        </div>

        <!-- Prev / Next Product Navigation -->
        <div class="nav-buttons-row">
          <button type="button" class="nav-arrow-btn" id="prev-prod-btn" aria-label="Previous product">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25">
              <line x1="18" y1="10" x2="2" y2="10"></line>
              <polyline points="8 4 2 10 8 16"></polyline>
            </svg>
          </button>
          <button type="button" class="nav-arrow-btn" id="next-prod-btn" aria-label="Next product">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25">
              <line x1="2" y1="10" x2="18" y2="10"></line>
              <polyline points="12 4 18 10 12 16"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- Footer Partial -->
<div data-include="partials/footer.html"></div>

<!-- Size Guide Modal Partial -->
<div data-include="partials/size-guide-modal.html"></div>

<!-- Mini Cart Partial -->
<div data-include="partials/mini-cart.html"></div>

<script src="assets/js/include.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/product.js"></script>
<script src="assets/js/cart-drawer.js"></script>
</body>
</html>
