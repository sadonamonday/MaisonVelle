<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SEPARATE TRACK HOODY - Product Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="base-tokens">
    body {
      background-color: #8E2B1C;
      font-family: Arial, Helvetica, sans-serif;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style data-purpose="glassmorphism-components">
    /* Floating Header Styling */
    .floating-header-glass {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      height: 56px;
    }

    /* Bottom Info Card Glass Container */
    .details-card-glass {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
    }
  </style>
</head>

<!-- BEGIN: MainContainer -->
<!-- Constrained mobile iOS layout container: 390px width -->
<body><main class="w-[390px] min-h-screen flex flex-col relative pb-3 overflow-hidden bg-white" data-purpose="mobile-product-container">
<!-- BEGIN: FloatingHeader -->
<!-- Floating header bar placed 12px from top and sides -->
<header class="absolute top-3 left-3 right-3 z-20 floating-header-glass flex items-center justify-between px-4" data-purpose="floating-header">
<!-- Back arrow navigation link -->
<a aria-label="Back" class="text-black hover:opacity-80 transition-opacity flex items-center justify-center p-1" href="#">
<svg class="w-6 h-6 stroke-black stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Shopping bag icon -->
<a aria-label="Shopping Bag" class="text-black hover:opacity-80 transition-opacity flex items-center justify-center p-1" href="#">
<svg class="w-6 h-6 stroke-black stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25c-.67 0-1.19-.578-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</header>
<!-- END: FloatingHeader -->
<!-- BEGIN: ProductPhotoArea -->
<!-- Full-width product photo area: 390px wide by 500px tall -->
<section class="relative w-[390px] h-[500px] flex items-center justify-center shrink-0" data-purpose="product-image-viewer">
<!-- Cream/Beige hoodie cut-out cleanly centred -->
<img alt="SEPARATE TRACK HOODY - Beige" class="w-[340px] h-[440px] object-contain drop-shadow-md z-0" data-purpose="product-display-photo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFrjh7coPD6tOYHrYYiRlNLmrcR76fddMBNwaQkvoONqpkUbzeNjGztYkig7OQeQ-b7sp0SMhCH2FI5AweTKJ13YHfqxyLvctLL00-DqfoAMj_g0tYNB1BXDKPO2pgtXnzfH3wT3hMMlGl1QBPoyNpuCNBLSdWEx7D48ThUcAErE2NhzJWTTtI9F3L_IHnNd3Aejn_jCbW03ToNF6D1r8T9u5lc22hv5LOJrijCpo">
<!-- Right chevron navigation arrow -->
<button aria-label="Next image" class="absolute right-4 top-1/2 -translate-y-1/2 z-10 text-black hover:opacity-75 transition-opacity" type="button">
<svg class="w-6 h-6 stroke-black stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</section>
<!-- END: ProductPhotoArea -->
<!-- BEGIN: DetailsCard -->
<!-- Bottom product information card with translucent blurred light backdrop -->
<article class="mx-3 mb-3 p-4 flex flex-col gap-3 text-black bg-white border-2 border-black" data-purpose="product-details-sheet">
<!-- 1) Title row: Title on left, price on right -->
<div class="flex items-baseline justify-between w-full gap-3" data-purpose="title-price-row">
<h1 class="text-[22px] font-bold tracking-tight uppercase text-black">SEPARATE TRACK HOODY</h1>
<span class="text-[22px] font-bold text-black">R1 299</span>
</div>
<!-- 2) Colour name -->
<div class="text-[16px] leading-tight text-black" data-purpose="color-label">
        Beige
      </div>
<!-- 3) Colour thumbnails: 2 square swatches (64px each, 8px apart) -->
<div class="flex items-center gap-2" data-purpose="color-swatches">
<!-- Swatch 1: Beige (Selected, 2px solid black border) -->
<button aria-label="Select Beige" class="w-16 h-16 bg-[#e5decf] border-2 border-black rounded-none cursor-pointer focus:outline-none transition-transform hover:scale-105" type="button"></button>
<!-- Swatch 2: Alternative color (Unselected, faint border) -->
<button aria-label="Select Charcoal" class="w-16 h-16 bg-[#262626] border border-gray-300 rounded-none cursor-pointer focus:outline-none transition-transform hover:scale-105" type="button"></button>
</div>
<!-- 4) Description: Four distinct lines -->
<div class="text-[16px] leading-relaxed flex flex-col gap-0.5 text-black" data-purpose="product-specs">
<p class="">100% cotton.</p>
<p class="">Panelled pullover top.</p>
<p class="">Wide silhouette.</p>
<p class="">Made in Japan.</p>
</div>
<!-- 5) Sizing link -->
<div>
<a class="text-[14px] underline text-black hover:opacity-80 transition-opacity" data-purpose="sizing-link" href="#sizing">sizing</a>
</div>
<!-- 6) Size selector: 48px high, 2px solid black border, square corners -->
<div class="relative w-full" data-purpose="size-selector-wrapper">
<select class="w-full h-12 bg-transparent text-black border-2 border-black rounded-none px-4 text-base font-normal appearance-none focus:outline-none focus:ring-0 focus:border-black cursor-pointer" data-purpose="size-dropdown">
<option class="bg-white text-black" value="small">Small</option>
<option class="bg-white text-black" value="medium">Medium</option>
<option class="bg-white text-black" value="large">Large</option>
<option class="bg-white text-black" value="xlarge">X-Large</option>
</select>
<!-- Downward chevron icon -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-black">
<svg class="w-5 h-5 stroke-black stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- 7) Sold out Button: Solid black fill, bold white text, 48px high, square corners -->
<button class="w-full h-12 bg-black text-white font-bold text-base rounded-none border-none flex items-center justify-center cursor-not-allowed select-none transition-opacity" data-purpose="sold-out-button" disabled="" type="button">
        Sold out
      </button>
<!-- 8) Navigation buttons: Two side-by-side buttons, 12px apart, 44px high, 2px black border -->
<nav aria-label="Product navigation" class="grid grid-cols-2 gap-3 w-full" data-purpose="product-nav-buttons">
<button aria-label="Previous product" class="w-full h-[44px] bg-transparent border-2 border-black rounded-none flex items-center justify-center text-black hover:bg-black/5 active:bg-black/10 transition-colors" type="button">
<svg class="w-6 h-6 stroke-black stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button aria-label="Next product" class="w-full h-[44px] bg-transparent border-2 border-black rounded-none flex items-center justify-center text-black hover:bg-black/5 active:bg-black/10 transition-colors" type="button">
<svg class="w-6 h-6 stroke-black stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
</article>
<!-- END: DetailsCard -->
</main>
<!-- END: MainContainer -->


</body></html>
